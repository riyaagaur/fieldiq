<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="12" font-weight="600" fill="#898781" letter-spacing="1.4">RUNTIME</text>
  <line x1="36" y1="52" x2="884" y2="52" stroke="#e1e0d9"/>

  <text x="36" y="92" font-size="13" fill="#52514e">question</text>
  <line x1="110" y1="88" x2="146" y2="88" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="154" y="68" width="112" height="40" rx="7" fill="#fff" stroke="#c3c2b7"/>
  <text x="210" y="86" font-size="12.5" fill="#0b0b0b" text-anchor="middle">input</text>
  <text x="210" y="101" font-size="12.5" fill="#0b0b0b" text-anchor="middle">guardrail</text>
  <line x1="266" y1="88" x2="302" y2="88" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="310" y="60" width="300" height="130" rx="9" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="460" y="82" font-size="12.5" font-weight="600" fill="#2a78d6" text-anchor="middle">agent loop</text>
  <rect x="332" y="96" width="112" height="34" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="388" y="117" font-size="12" fill="#0b0b0b" text-anchor="middle">model</text>
  <rect x="478" y="96" width="112" height="34" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="534" y="112" font-size="12" fill="#0b0b0b" text-anchor="middle">6 tools</text>
  <text x="534" y="125" font-size="10.5" fill="#898781" text-anchor="middle">docs · CRM · pricing</text>
  <line x1="444" y1="107" x2="474" y2="107" stroke="#898781" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="474" y1="120" x2="444" y2="120" stroke="#898781" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="460" y="166" font-size="11" fill="#898781" text-anchor="middle">retrieve · reason · cite, up to 6 steps</text>

  <line x1="610" y1="88" x2="646" y2="88" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="654" y="68" width="112" height="40" rx="7" fill="#fff" stroke="#c3c2b7"/>
  <text x="710" y="86" font-size="12.5" fill="#0b0b0b" text-anchor="middle">output</text>
  <text x="710" y="101" font-size="12.5" fill="#0b0b0b" text-anchor="middle">guardrail</text>
  <line x1="766" y1="88" x2="802" y2="88" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="812" y="92" font-size="13" fill="#52514e">answer</text>

  <path d="M460 190 L460 214" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="472" y="208" font-size="11" fill="#898781">every step traced</text>

  <text x="36" y="258" font-size="12" font-weight="600" fill="#898781" letter-spacing="1.4">EVALUATION</text>
  <line x1="36" y1="270" x2="884" y2="270" stroke="#e1e0d9"/>

  <rect x="36" y="292" width="150" height="54" rx="7" fill="#fff" stroke="#c3c2b7"/>
  <text x="111" y="313" font-size="12.5" fill="#0b0b0b" text-anchor="middle">80 cases</text>
  <text x="111" y="330" font-size="10.5" fill="#898781" text-anchor="middle">60 golden · 20 adversarial</text>
  <line x1="186" y1="319" x2="222" y2="319" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="230" y="282" width="252" height="74" rx="7" fill="#fff" stroke="#c3c2b7"/>
  <text x="356" y="301" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">scorers</text>
  <text x="356" y="319" font-size="11" fill="#52514e" text-anchor="middle">deterministic rules</text>
  <text x="356" y="334" font-size="11" fill="#52514e" text-anchor="middle">grounding verifier</text>
  <text x="356" y="349" font-size="11" fill="#52514e" text-anchor="middle">LLM judge, calibrated to hand labels</text>
  <line x1="482" y1="319" x2="518" y2="319" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="526" y="292" width="162" height="54" rx="7" fill="#fff" stroke="#c3c2b7"/>
  <text x="607" y="313" font-size="12.5" fill="#0b0b0b" text-anchor="middle">release gate</text>
  <text x="607" y="330" font-size="10.5" fill="#898781" text-anchor="middle">vs baseline + noise floor</text>

  <line x1="688" y1="308" x2="736" y2="300" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="688" y1="331" x2="736" y2="339" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="748" y="304" font-size="13" font-weight="650" fill="#0ca30c">ship</text>
  <text x="748" y="344" font-size="13" font-weight="650" fill="#d03b3b">block the merge</text>

  <text x="36" y="398" font-size="11" fill="#898781">Guardrails are measured on what they catch and on what they wrongly block — both numbers, always.</text>
  <text x="36" y="416" font-size="11" fill="#898781">The judge is never the model being judged. Every metric carries a measured noise floor.</text>
</svg>
